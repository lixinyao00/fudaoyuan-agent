server:
  port: 8080

spring:
  application:
    name: my-rag-agent

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  # 数据库配置 (MySQL 生产库)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/ragdb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:rag}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  
# 内置知识库（启动时自动导入，库中已有则跳过；设为 false 可关闭）
rag:
  kb:
    # Disabled in the source-only distribution; provide the PDF before enabling.
    enabled: false
    title: 学生手册.pdf
    resource: classpath:kb/student-handbook.pdf

# 应用认证配置
app:
  jwt:
    # HS256 密钥（需 >= 32 字节），生产环境请通过环境变量覆盖
    secret: ${APP_JWT_SECRET}
    # token 有效期（小时）
    expiration-hours: 24
  default-admin:
    # 启动时自动创建的默认管理员
    username: admin
    password: ${APP_DEFAULT_ADMIN_PASSWORD}

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    com.study.ragagent: DEBUG
    org.springframework: INFO

# 大模型接口配置
ai:
  provider: mimo
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    max-tokens: 800
    temperature: 0.2
  mimo:
    api-key: ${MIMO_API_KEY:}
    base-url: https://api.xiaomimimo.com/v1
    model: mimo-v2.6-flash
    max-tokens: 800
    temperature: 0.2
    # MiMo 推理强度：low | medium | high
    reasoning-effort: low
  embedding:
    # Embedding 用千问（阿里云 DashScope）
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: text-embedding-v3
    dimension: 1024

# Milvus 配置
milvus:
  enabled: true
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: knowledge_base
  dimension: 1024
